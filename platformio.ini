[env:m5go]
platform = platformio/espressif32@6.12.0
board = m5stack-core-esp32-16M
framework = arduino

upload_port = /dev/cu.usbserial-588D0027491
upload_speed = 230400
monitor_port = /dev/cu.usbserial-588D0027491
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    m5stack/M5Unified@0.2.19
