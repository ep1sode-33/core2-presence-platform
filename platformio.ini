[platformio]
default_envs = m5go

[env:m5go]
platform = platformio/espressif32@6.12.0
board = m5stack-core-esp32-16M
framework = arduino
extra_scripts = pre:tools/firmware_build_info.py

upload_port = /dev/cu.usbserial-588D0027491
upload_speed = 230400
monitor_port = /dev/cu.usbserial-588D0027491
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    m5stack/M5Unified@0.2.19

# Explicit serial recovery alias. The original m5go environment remains the
# default so existing build/upload commands do not change behavior.
[env:m5go-serial]
extends = env:m5go
upload_protocol = esptool

# Development-only OTA convenience path. The firmware listener is opened only
# by a physical, timed diagnostics action; host and secret are injected at
# upload time and are never committed to this file.
[env:m5go-ota]
extends = env:m5go
upload_protocol = espota
upload_flags =
    --auth=${sysenv.M5GO_OTA_SECRET}
extra_scripts =
    pre:tools/firmware_build_info.py
    pre:tools/ota_upload_guard.py
